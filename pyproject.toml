[project]
name = "bca-mcp"
version = "0.5.2"
description = "Blockchain Academics MCP server + `bca` CLI — crypto news, entity dossiers, market data, proprietary indicators, and academy explainers for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Blockchain Academics", email = "dev@blockchainacademics.com"}]
keywords = ["mcp", "crypto", "blockchain", "llm", "agents", "ai", "news"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  # Pinned <2: mcp 2.x removed the low-level `Server.list_tools()` /
  # `call_tool()` decorator API that server.py builds the tool surface with, so
  # a fresh install pulling mcp 2.x makes the stdio server fail to start. This
  # was masked in 0.5.0/0.5.1 by the _demo_key import crash. Migrating server.py
  # to the mcp 2.x API is tracked as a separate follow-up.
  "mcp>=1.0.0,<2.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "typer>=0.12",
  "rich>=13.7",
  "tomli-w>=1.0",
  "tomli>=2.0;python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-httpx>=0.30",
  "respx>=0.21",
  "build>=1.2",
]

[project.urls]
Homepage = "https://blockchainacademics.com"
Repository = "https://github.com/blockchainacademics/bca-mcp-python"
Issues = "https://github.com/blockchainacademics/bca-mcp-python/issues"

[project.scripts]
bca-mcp = "bca_mcp.__main__:main"
bca = "bca_mcp.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# src/bca_mcp/_demo_key.py is generated (scripts/gen_demo_key.py) and gitignored.
# Hatchling excludes gitignored files by default, so 0.5.0/0.5.1 shipped WITHOUT
# it and `import bca_mcp` crashed (client.py imports it at module load).
# force-include it here so the wheel + sdist always carry it. client.py also has
# a literal fallback (belt-and-suspenders) in case the generator wasn't run.
artifacts = ["src/bca_mcp/_demo_key.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/bca_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
