name: Publish

# Publishes to PyPI through trusted publishing (OIDC): no API token anywhere
# (the previous token was burned after the 2026-10-21 Railway breach).
# One-time setup on pypi.org: project bca-mcp > Publishing > add a GitHub
# publisher: owner blockchainacademics, repository bca-mcp-python,
# workflow publish.yml, environment pypi.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      # _demo_key.py is generated and gitignored; generate it so the wheel
      # carries the current demo key (client.py's literal fallback is only a
      # safety net and goes stale if the key rotates).
      - run: python scripts/gen_demo_key.py
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
