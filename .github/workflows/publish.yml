name: Publish

# Publishes to PyPI through trusted publishing (OIDC): no API token anywhere
# (the previous token was burned after the 2026-10-21 Railway breach).
# One-time setup on pypi.org: project bca-mcp > Publishing > add a GitHub
# publisher: owner blockchainacademics, repository bca-mcp-python,
# workflow publish.yml, environment pypi.
#
# The publish job runs in the GitHub environment `pypi`. A release waits for
# the approval of that environment's required reviewer, who is set on GitHub
# (Settings > Environments > pypi), not in this file.
#
# Every action is pinned by its full commit, never by a branch or a tag that
# can move (AGENTS-12). The comment names the release each commit is. To move
# one: gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
on:
  push:
    tags: ["v*"]

jobs:
  # A PyPI version can never be uploaded twice, so the tests of the tagged
  # commit must pass before anything is.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python scripts/gen_demo_key.py
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # The tag must name the version that would be published, so a stray or
      # mistyped tag (v0.7.0-rc1, say) fails here instead of uploading 0.7.0.
      - run: |
          version="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi
      - run: python -m pip install --upgrade build
      # _demo_key.py is generated and gitignored; generate it so the wheel
      # carries the current demo key (client.py's literal fallback is only a
      # safety net and goes stale if the key rotates).
      - run: python scripts/gen_demo_key.py
      - run: python -m build
      # The wheel that will be uploaded, installed into a clean venv outside
      # the source tree: the server must import from it.
      - run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/python -c "from bca_mcp.server import TOOLS; print(len(TOOLS), 'tools')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
