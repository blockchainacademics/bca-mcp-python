name: Publish

# Publishes to PyPI through trusted publishing (OIDC): no API token anywhere
# (the previous token was burned after the 2026-10-21 Railway breach).
# One-time setup on pypi.org: project bca-mcp > Publishing > add a GitHub
# publisher: owner blockchainacademics, repository bca-mcp-python,
# workflow publish.yml, environment pypi.
on:
  push:
    tags: ["v*"]

jobs:
  # A PyPI version can never be uploaded twice, so the tests of the tagged
  # commit must pass before anything is.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/gen_demo_key.py
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tag must name the version that would be published, so a stray or
      # mistyped tag (v0.6.4-rc1, say) fails here instead of uploading 0.6.4.
      - run: |
          version="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi
      - run: python -m pip install --upgrade build
      # _demo_key.py is generated and gitignored; generate it so the wheel
      # carries the current demo key (client.py's literal fallback is only a
      # safety net and goes stale if the key rotates).
      - run: python scripts/gen_demo_key.py
      - run: python -m build
      # The wheel that will be uploaded, installed into a clean venv outside
      # the source tree: the server must import from it.
      - run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/python -c "from bca_mcp.server import TOOLS; print(len(TOOLS), 'tools')"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
